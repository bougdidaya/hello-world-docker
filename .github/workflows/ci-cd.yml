
name: CI-CD Hello World Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f app/index.html
          test -f app/style.css
          test -f app/script.js
          test -f Dockerfile
          echo "All required files are present."

      - name: Validate JavaScript syntax
        run: node --check app/script.js

      - name: Validate HTML references
        run: |
          grep -q 'style.css' app/index.html
          grep -q 'script.js' app/index.html
          echo "HTML references are valid."

  docker-build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hello-world-app
          tags: |
            type=raw,value=latest
            type=sha

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy application to Ubuntu
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Pull latest Docker image
        run: docker pull "${{ secrets.DOCKERHUB_USERNAME }}/hello-world-app:latest"

      - name: Replace running container
        run: |
          docker rm -f hello-world-container || true
          docker run -d \
            --name hello-world-container \
            --restart unless-stopped \
            -p 8080:80 \
            "${{ secrets.DOCKERHUB_USERNAME }}/hello-world-app:latest"

      - name: Verify deployment
        run: |
          docker ps
          curl --retry 5 --retry-delay 2 --retry-connrefused \
            -f http://localhost:8080/


